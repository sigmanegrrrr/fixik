<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FiXiK CLXN — Majestic RP</title>
<meta name="description" content="FiXiK CLXN — семья на Majestic RP (сервер Memphis). Команда, характер и общая история.">
<meta name="theme-color" content="#08090d">
<link rel="icon" href="logo.png" type="image/png">

<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #08090d;
    --panel: #11131b;
    --purple: #8b5cf6;
    --purple-light: #b49aff;
    --white: #f5f5f7;
    --gray: #9293a0;
    --border: rgba(255,255,255,0.08);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

a {
    text-decoration: none;
    color: inherit;
}

button {
    font-family: inherit;
    border: none;
    cursor: pointer;
    color: inherit;
}

/* NAVBAR */
.navbar {
    position: fixed;
    top: 0;
    width: 100%;
    height: 78px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
    z-index: 1000;
    background: rgba(8,9,13,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
}

.logo-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: contain;
    background: #11131b;
    border: 1px solid rgba(139,92,246,.35);
    box-shadow: 0 0 25px rgba(139,92,246,.25);
}

.logo-text {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    letter-spacing: 2px;
}

.logo-text span {
    display: block;
    font-size: 9px;
    color: var(--gray);
    letter-spacing: 4px;
    margin-top: 3px;
}

.nav-links {
    display: flex;
    gap: 24px;
    align-items: center;
}

.tab-btn {
    background: transparent;
    color: #a7a7b3;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 4px;
    position: relative;
    transition: .3s;
}

.tab-btn:hover, .tab-btn.active {
    color: var(--white);
}

.tab-btn.active::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 2px;
    background: var(--purple);
    box-shadow: 0 0 10px var(--purple);
}

.nav-button {
    padding: 11px 18px;
    background: var(--purple);
    border-radius: 7px;
    font-size: 12px;
    font-weight: 700;
    color: var(--white);
    transition: .3s;
}

.nav-button:hover {
    background: #a078ff;
    box-shadow: 0 0 25px rgba(139,92,246,.3);
}

/* TABS SYSTEM */
main {
    flex: 1;
}

.tab-page {
    display: none;
    animation: fadeIn .35s ease;
}

.tab-page.active {
    display: block;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* HERO (TAB 1) */
.hero {
    min-height: 100vh;
    position: relative;
    display: flex;
    align-items: center;
    padding: 120px 10% 90px;
    background:
      linear-gradient(90deg, rgba(8,9,13,.96) 0%, rgba(8,9,13,.78) 55%, rgba(8,9,13,.45) 100%),
      linear-gradient(0deg, #08090d 0%, transparent 35%),
      url('logo.png');
    background-size: cover;
    background-position: center;
}

.hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 70% 50%, rgba(124,58,237,.16), transparent 45%);
    pointer-events: none;
}

.hero-content {
    position: relative;
    z-index: 2;
    max-width: 750px;
}

.label {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    border: 1px solid rgba(167,139,250,.3);
    padding: 9px 14px;
    color: var(--purple-light);
    font-size: 10px;
    letter-spacing: 3px;
    border-radius: 4px;
    margin-bottom: 25px;
    background: rgba(139,92,246,0.06);
}

.label-dot {
    width: 7px;
    height: 7px;
    background: #a78bfa;
    border-radius: 50%;
    box-shadow: 0 0 10px #a78bfa;
}

.hero h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(46px, 8vw, 96px);
    line-height: 1.08;
    font-weight: 800;
    letter-spacing: -2px;
}

.hero h1 span {
    color: var(--purple-light);
    text-shadow: 0 0 45px rgba(139,92,246,.3);
}

.hero-description {
    color: #a7a7b3;
    font-size: 15px;
    line-height: 1.8;
    max-width: 510px;
    margin-top: 24px;
}

.hero-buttons {
    display: flex;
    gap: 14px;
    margin-top: 35px;
    flex-wrap: wrap;
}

.button-primary, .button-secondary {
    padding: 15px 24px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: .3s;
}

.button-primary {
    background: var(--purple);
}

.button-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(139,92,246,.3);
}

.button-secondary {
    border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.04);
}

.button-secondary:hover {
    background: rgba(255,255,255,.1);
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, auto);
    justify-content: start;
    column-gap: 50px;
    max-width: 600px;
    margin-top: 65px;
    border-top: 1px solid var(--border);
    padding-top: 25px;
}

.stat h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 28px;
}

.stat p {
    color: var(--gray);
    font-size: 10px;
    letter-spacing: 2px;
    margin-top: 8px;
}

/* COMMON PAGE SECTIONS */
section.content-section {
    padding: 135px 10% 90px;
    min-height: calc(100vh - 90px);
}

.section-heading {
    margin-bottom: 50px;
}

.section-tag {
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--purple-light);
    margin-bottom: 15px;
}

.section-heading h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(30px, 4vw, 48px);
}

.section-heading p {
    color: var(--gray);
    margin-top: 15px;
    line-height: 1.8;
    max-width: 620px;
}

/* ABOUT GRID */
.about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.about-card {
    padding: 35px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: .3s;
}

.about-card:hover {
    border-color: rgba(167,139,250,.35);
    transform: translateY(-4px);
}

.about-card .icon {
    font-size: 25px;
    margin-bottom: 20px;
}

.about-card h3 {
    font-family: 'Orbitron', sans-serif;
    font-size: 17px;
    margin-bottom: 13px;
}

.about-card p {
    color: var(--gray);
    line-height: 1.8;
    font-size: 13px;
}

/* PAST FAMILIES TIMELINE */
.timeline {
    display: flex;
    flex-direction: column;
    gap: 20px;
    border-left: 2px solid rgba(139,92,246,.35);
    padding-left: 30px;
    margin-left: 10px;
}

.timeline-item {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 32px;
    position: relative;
    transition: .3s;
}

.timeline-item:hover {
    border-color: var(--purple);
}

.timeline-item::before {
    content: "";
    position: absolute;
    left: -37px;
    top: 32px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--purple);
    box-shadow: 0 0 12px var(--purple);
}

.timeline-badge {
    display: inline-block;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    color: var(--purple-light);
    background: rgba(139,92,246,.12);
    padding: 4px 10px;
    border-radius: 4px;
    margin-bottom: 12px;
}

.timeline-item h3 {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    margin-bottom: 10px;
}

.timeline-item p {
    color: var(--gray);
    font-size: 14px;
    line-height: 1.7;
}

/* RANKS */
.ranks {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.rank {
    padding: 28px 22px;
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 10px;
    transition: .3s;
}

.rank:hover {
    border-color: var(--purple);
    transform: translateY(-5px);
}

.rank-number {
    color: var(--purple-light);
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    margin-bottom: 20px;
}

.rank h3 {
    font-family: 'Orbitron', sans-serif;
    font-size: 15px;
    margin-bottom: 10px;
}

.rank p {
    font-size: 12px;
    color: var(--gray);
    line-height: 1.7;
}

/* LEADERS & MEDIA */
.leaders-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 45px;
}

.leader-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 25px;
}

.leader-role {
    color: var(--purple-light);
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    margin-bottom: 8px;
}

.leader-card h3 {
    font-family: 'Orbitron', sans-serif;
    font-size: 18px;
    margin-bottom: 6px;
}

.leader-card span {
    color: var(--gray);
    font-size: 12px;
}

.media-box {
    background: var(--panel);
    border: 1px dashed rgba(139,92,246,.4);
    border-radius: 12px;
    padding: 45px 25px;
    text-align: center;
}

.media-box h3 {
    font-family: 'Orbitron', sans-serif;
    margin-bottom: 10px;
}

.media-box p {
    color: var(--gray);
    font-size: 13px;
    margin-bottom: 20px;
}

/* MODAL */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(8,9,13,0.85);
    backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    padding: 20px;
}

.modal-overlay.active {
    display: flex;
